name: Cross-Version Duplicate Analysis

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub repository URL to analyze'
        required: true
        type: string
        default: 'https://github.com/django/django.git'

      tag_regex:
        description: 'Regex for version tags (e.g., "^[0-9]+\.[0-9]+$" for Django)'
        required: true
        type: string
        default: '^[0-9]+\.[0-9]+$'

      max_versions:
        description: 'Maximum versions to process (0 = all)'
        required: false
        default: '0'
        type: string

      base_model_run_id:
        description: 'Run ID from base model workflow (find in URL: .../actions/runs/[RUN_ID])'
        required: true
        default: '32718528477'
        type: string

      base_model_artifact:
        description: 'Name of the base model artifact'
        required: true
        default: 'base-model-python-100repos'
        type: string

      file_extensions:
        description: 'File extensions (space-separated, e.g., ".java .scala")'
        required: true
        default: '.py'
        type: string

      finetune_epochs:
        description: 'Number of fine-tuning epochs'
        required: false
        default: '10'
        type: string

      update_vocab:
        description: 'Update vocabulary with new words from target repo'
        required: false
        default: true
        type: boolean

      duplicate_threshold:
        description: 'Cosine similarity threshold for duplicate detection'
        required: false
        default: '0.99'
        type: string

      source_dir:
        description: 'Subdirectory within repo to restrict file search (e.g., "django"). Leave empty for entire repo.'
        required: false
        default: 'django'
        type: string

      labels_dir:
        description: 'Path to bug label CSVs (e.g., "resources/calcite/file_level"). Leave empty to skip enrichment.'
        required: false
        default: 'resources/django 1/file_level'
        type: string

jobs:
  cross-version-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download base model artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./base_model
          gh run download ${{ github.event.inputs.base_model_run_id }} \
            -R ${{ github.repository }} \
            -n ${{ github.event.inputs.base_model_artifact }} \
            -D ./base_model

      - name: List downloaded files
        run: |
          echo "Base model files:"
          ls -la ./base_model/

      - name: Extract repository name
        id: repo_name
        run: |
          REPO_NAME=$(echo "${{ github.event.inputs.repo_url }}" | sed 's|.*/||; s|\.git$||')
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "Repository name: ${REPO_NAME}"

      - name: Setup swap space
        run: |
          echo "Setting up additional swap space..."
          sudo fallocate -l 8G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          sudo swapon --show

      - name: Run cross-version analysis
        run: |
          BASE_MODEL=$(find ./base_model -name "*.d2v" | head -1)
          echo "Using base model: $BASE_MODEL"

          VOCAB_FLAG=""
          if [ "${{ github.event.inputs.update_vocab }}" = "false" ]; then
            VOCAB_FLAG="--no-vocab-update"
          fi

          MAX_VER_FLAG=""
          if [ "${{ github.event.inputs.max_versions }}" != "0" ]; then
            MAX_VER_FLAG="--max-versions ${{ github.event.inputs.max_versions }}"
          fi

          SOURCE_DIR_FLAG=""
          if [ -n "${{ github.event.inputs.source_dir }}" ]; then
            SOURCE_DIR_FLAG="--source-dir ${{ github.event.inputs.source_dir }}"
            echo "Source directory: ${{ github.event.inputs.source_dir }}"
          fi

          python src/cross_version_pipeline.py \
            --repo "${{ github.event.inputs.repo_url }}" \
            --base-model "$BASE_MODEL" \
            --tag-regex "${{ github.event.inputs.tag_regex }}" \
            --ext ${{ github.event.inputs.file_extensions }} \
            --output "${{ steps.repo_name.outputs.repo_name }}" \
            --epochs ${{ github.event.inputs.finetune_epochs }} \
            --threshold ${{ github.event.inputs.duplicate_threshold }} \
            $VOCAB_FLAG $MAX_VER_FLAG $SOURCE_DIR_FLAG

      - name: Enrich leakage with bug labels
        if: ${{ inputs.labels_dir != '' }}
        run: |
          echo "Enriching leakage pairs with labels from ${{ inputs.labels_dir }}"
          python src/enrich_leakage.py \
            --metadata "${{ steps.repo_name.outputs.repo_name }}_cross_version_metadata.json" \
            --labels-dir "${{ inputs.labels_dir }}" \
            --output-prefix "${{ steps.repo_name.outputs.repo_name }}"

      - name: Write Job Summary
        if: always()
        run: |
          METADATA_FILE="${{ steps.repo_name.outputs.repo_name }}_cross_version_metadata.json"

          if [ -f "$METADATA_FILE" ]; then
            VERSIONS=$(python -c "import json; m=json.load(open('$METADATA_FILE')); print(len(m['versions_analyzed']))")
            TOTAL_FILES=$(python -c "import json; m=json.load(open('$METADATA_FILE')); print(sum(m['files_per_version'].values()))")
            ELAPSED=$(python -c "import json; m=json.load(open('$METADATA_FILE')); print(m['elapsed_time_minutes'])")
            TOTAL_DUPS=$(python -c "import json; m=json.load(open('$METADATA_FILE')); print(m['overall_result'].get('total_duplicate_pairs', 'N/A'))")

            # Build version table
            VERSION_TABLE=$(python -c "
          import json
          m = json.load(open('$METADATA_FILE'))
          for v, count in m['files_per_version'].items():
              print(f'| {v} | {count} |')
          ")

            # Build leakage table (combined with labels if available)
            SUMMARY_FILE="${{ steps.repo_name.outputs.repo_name }}_leakage_summary.csv"
            PAIRS_TABLE=$(python -c "
          import json, csv, os
          m = json.load(open('$METADATA_FILE'))
          summary = {}
          if os.path.exists('$SUMMARY_FILE'):
              with open('$SUMMARY_FILE') as f:
                  for r in csv.DictReader(f):
                      summary[(r['version_a'], r['version_b'])] = r
          for r in m['consecutive_pair_results']:
              s = summary.get((r['version_a'], r['version_b']))
              if s:
                  sf = f'{s[\"same_file_leaked_buggy\"]}B/{s[\"same_file_leaked_clean\"]}C'
                  co = f'{s[\"collision_leaked_buggy\"]}B/{s[\"collision_leaked_clean\"]}C'
                  print(f'| {r[\"version_a\"]} vs {r[\"version_b\"]} | {r[\"training_set_size\"]} | {r[\"test_set_size\"]} | {s[\"test_buggy\"]} | {s[\"test_clean\"]} | {s[\"leaked_buggy\"]} ({s[\"buggy_leak_pct\"]}%) | {s[\"leaked_clean\"]} ({s[\"clean_leak_pct\"]}%) | {sf} | {co} |')
              else:
                  sf = r.get('same_file_leakage_files', 'N/A')
                  co = r.get('collision_leakage_files', 'N/A')
                  print(f'| {r[\"version_a\"]} vs {r[\"version_b\"]} | {r[\"training_set_size\"]} | {r[\"test_set_size\"]} | - | - | {r[\"test_entries_with_leakage\"]} ({r[\"test_leakage_percentage\"]}%) | - | {sf} | {co} |')
          ")

            cat >> $GITHUB_STEP_SUMMARY << EOF
          # Cross-Version Duplicate Analysis Report

          ## Configuration

          | Setting | Value |
          |---------|-------|
          | **Repository** | ${{ github.event.inputs.repo_url }} |
          | **Tag regex** | ${{ github.event.inputs.tag_regex }} |
          | **Versions analyzed** | ${VERSIONS} |
          | **Embedding mode** | infer_vector (epochs=200) |
          | **Threshold** | ${{ github.event.inputs.duplicate_threshold }} |
          | **Total time** | ${ELAPSED} minutes |
          | **Total duplicate pairs** | ${TOTAL_DUPS} |

          ## Files per Version

          | Version | Files |
          |---------|-------|
          ${VERSION_TABLE}
          | **Total** | **${TOTAL_FILES}** |

          ## Cross-Version Leakage

          | Pair | Train | Test | Test Buggy | Test Clean | Leaked Buggy | Leaked Clean | Same File | Collision |
          |------|-------|------|------------|------------|--------------|--------------|-----------|-----------|
          ${PAIRS_TABLE}

          EOF

            cat >> $GITHUB_STEP_SUMMARY << EOF
          ---
          *Generated by [doc2vec-experiments](https://github.com/${{ github.repository }})*
          EOF
          else
            echo "## Cross-Version Analysis" >> $GITHUB_STEP_SUMMARY
            echo "Analysis did not complete successfully. Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-version-${{ steps.repo_name.outputs.repo_name }}
          path: |
            ${{ steps.repo_name.outputs.repo_name }}_*
          retention-days: 90
