name: Embedding Strategies Analysis

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Training strategy'
        required: true
        type: choice
        options:
          - pairwise
          - cumulative-fresh

      project:
        description: 'Target project preset'
        required: true
        type: choice
        options:
          - django
          - calcite

      max_versions:
        description: 'Maximum versions to process (0 = all)'
        required: false
        default: '0'
        type: string

      finetune_epochs:
        description: 'Number of fine-tuning epochs'
        required: false
        default: '10'
        type: string

      duplicate_threshold:
        description: 'Cosine similarity threshold for duplicate detection'
        required: false
        default: '0.99'
        type: string

jobs:
  embedding-strategies:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set project configuration
        id: config
        run: |
          PROJECT="${{ github.event.inputs.project }}"

          if [ "$PROJECT" = "django" ]; then
            echo "repo_url=https://github.com/django/django.git" >> $GITHUB_OUTPUT
            echo "repo_name=django" >> $GITHUB_OUTPUT
            echo "tag_regex=^[0-9]+\.[0-9]+$" >> $GITHUB_OUTPUT
            echo "file_extensions=.py" >> $GITHUB_OUTPUT
            echo "source_dir=django" >> $GITHUB_OUTPUT
            echo "labels_dir=resources/django 1/file_level" >> $GITHUB_OUTPUT
            echo "base_model_run_id=32718528477" >> $GITHUB_OUTPUT
            echo "base_model_artifact=base-model-python-100repos" >> $GITHUB_OUTPUT
          elif [ "$PROJECT" = "calcite" ]; then
            echo "repo_url=https://github.com/apache/calcite.git" >> $GITHUB_OUTPUT
            echo "repo_name=calcite" >> $GITHUB_OUTPUT
            echo 'tag_regex=calcite-1\.([0-9]|1[0-5])\.0(-incubating)?$' >> $GITHUB_OUTPUT
            echo "file_extensions=.java" >> $GITHUB_OUTPUT
            echo "source_dir=" >> $GITHUB_OUTPUT
            echo "labels_dir=resources/calcite/file_level" >> $GITHUB_OUTPUT
            echo "base_model_run_id=32937494910" >> $GITHUB_OUTPUT
            echo "base_model_artifact=base-model-java-100repos" >> $GITHUB_OUTPUT
          fi

          echo "Project: $PROJECT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download base model artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./base_model
          gh run download ${{ steps.config.outputs.base_model_run_id }} \
            -R ${{ github.repository }} \
            -n ${{ steps.config.outputs.base_model_artifact }} \
            -D ./base_model

      - name: List downloaded files
        run: |
          echo "Base model files:"
          ls -la ./base_model/

      - name: Setup swap space
        run: |
          echo "Setting up additional swap space..."
          sudo fallocate -l 16G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          sudo swapon --show

      - name: Run embedding strategy pipeline
        run: |
          BASE_MODEL=$(find ./base_model -name "*.d2v" | head -1)
          echo "Using base model: $BASE_MODEL"

          MAX_VER_FLAG=""
          if [ "${{ github.event.inputs.max_versions }}" != "0" ]; then
            MAX_VER_FLAG="--max-versions ${{ github.event.inputs.max_versions }}"
          fi

          SOURCE_DIR_ARGS=()
          if [ -n "${{ steps.config.outputs.source_dir }}" ]; then
            SOURCE_DIR_ARGS=(--source-dir "${{ steps.config.outputs.source_dir }}")
          fi

          LABELS_ARGS=()
          if [ -n "${{ steps.config.outputs.labels_dir }}" ]; then
            LABELS_ARGS=(--labels-dir "${{ steps.config.outputs.labels_dir }}")
          fi

          python src/pairwise_pipeline.py \
            --strategy "${{ github.event.inputs.strategy }}" \
            --repo "${{ steps.config.outputs.repo_url }}" \
            --base-model "$BASE_MODEL" \
            --tag-regex "${{ steps.config.outputs.tag_regex }}" \
            --ext ${{ steps.config.outputs.file_extensions }} \
            --output "${{ steps.config.outputs.repo_name }}_${{ github.event.inputs.strategy }}" \
            --epochs ${{ github.event.inputs.finetune_epochs }} \
            --threshold ${{ github.event.inputs.duplicate_threshold }} \
            $MAX_VER_FLAG "${SOURCE_DIR_ARGS[@]}" "${LABELS_ARGS[@]}"

      - name: Write Job Summary
        if: always()
        run: |
          STRATEGY="${{ github.event.inputs.strategy }}"
          STRATEGY_UNDERSCORE=$(echo "$STRATEGY" | tr '-' '_')
          REPO_NAME="${{ steps.config.outputs.repo_name }}"
          PREFIX="${REPO_NAME}_${STRATEGY}"
          METADATA_FILE="${PREFIX}_${STRATEGY_UNDERSCORE}_metadata.json"

          if [ -f "$METADATA_FILE" ]; then
            VERSIONS=$(python -c "import json; m=json.load(open('$METADATA_FILE')); print(len(m['versions_analyzed']))")
            TOTAL_FILES=$(python -c "import json; m=json.load(open('$METADATA_FILE')); print(sum(m['files_per_version'].values()))")
            ELAPSED=$(python -c "import json; m=json.load(open('$METADATA_FILE')); print(m['elapsed_time_minutes'])")
            ITERATIONS=$(python -c "import json; m=json.load(open('$METADATA_FILE')); print(len(m['results']))")

            VERSION_TABLE=$(python -c "
          import json
          m = json.load(open('$METADATA_FILE'))
          for v, count in m['files_per_version'].items():
              print(f'| {v} | {count} |')
          ")

            if [ "$STRATEGY" = "pairwise" ]; then
              RESULTS_HEADER="| Pair | Version A | Version B | Files A | Files B | Leakage | Same File | Collision |"
              RESULTS_SEPARATOR="|------|-----------|-----------|---------|---------|---------|-----------|-----------|"
              RESULTS_TABLE=$(python -c "
          import json
          m = json.load(open('$METADATA_FILE'))
          for r in m['results']:
              print(f'| {r[\"pair\"]} | {r[\"version_a\"]} | {r[\"version_b\"]} | {r[\"files_a\"]} | {r[\"files_b\"]} | {r[\"test_leakage_files\"]} ({r[\"test_leakage_pct\"]}%) | {r[\"same_file_pairs\"]} | {r[\"collision_pairs\"]} |')
          ")
            else
              RESULTS_HEADER="| Iter | Train | Test | Train Size | Test Size | Leakage | Same File | Collision |"
              RESULTS_SEPARATOR="|------|-------|------|------------|-----------|---------|-----------|-----------|"
              RESULTS_TABLE=$(python -c "
          import json
          m = json.load(open('$METADATA_FILE'))
          for r in m['results']:
              train = ', '.join(r['train_versions'])
              print(f'| {r[\"iteration\"]} | {train} | {r[\"test_version\"]} | {r[\"train_size\"]} | {r[\"test_size\"]} | {r[\"test_leakage_files\"]} ({r[\"test_leakage_pct\"]}%) | {r[\"same_file_pairs\"]} | {r[\"collision_pairs\"]} |')
          ")
            fi

            cat >> $GITHUB_STEP_SUMMARY << EOF
          # Embedding Strategies Analysis Report

          ## Configuration

          | Setting | Value |
          |---------|-------|
          | **Strategy** | ${STRATEGY} |
          | **Project** | ${{ github.event.inputs.project }} |
          | **Repository** | ${{ steps.config.outputs.repo_url }} |
          | **Tag regex** | ${{ steps.config.outputs.tag_regex }} |
          | **Versions analyzed** | ${VERSIONS} |
          | **Iterations** | ${ITERATIONS} |
          | **Embedding mode** | infer_vector (epochs=200) |
          | **Threshold** | ${{ github.event.inputs.duplicate_threshold }} |
          | **Total time** | ${ELAPSED} minutes |

          ## Files per Version

          | Version | Files |
          |---------|-------|
          ${VERSION_TABLE}
          | **Total** | **${TOTAL_FILES}** |

          ## Results

          ${RESULTS_HEADER}
          ${RESULTS_SEPARATOR}
          ${RESULTS_TABLE}

          EOF

            cat >> $GITHUB_STEP_SUMMARY << EOF
          ---
          *Generated by [doc2vec-experiments](https://github.com/${{ github.repository }})*
          EOF
          else
            echo "## Embedding Strategies Analysis" >> $GITHUB_STEP_SUMMARY
            echo "Analysis did not complete successfully. Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.strategy }}-${{ steps.config.outputs.repo_name }}
          path: |
            ${{ steps.config.outputs.repo_name }}_${{ github.event.inputs.strategy }}_*
          retention-days: 90
